name: Feature request
description: Something FERAL should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The task, not the implementation. "I want FERAL to remember what
        my glasses saw during a call" tells us more than "add a vision
        buffer", because the second one fixes the shape of the answer
        before anyone has agreed on the question.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: |
        What you do instead, or where it stops. If a tool exists but
        does the wrong thing, name it: that is usually a smaller change
        than a new capability.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you think it should look like
      description: Optional. A sketch, an API, a CLI invocation, a screenshot.
    validations:
      required: false
