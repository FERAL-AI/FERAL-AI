name: Docs lint

on:
  pull_request:
    paths:
      - 'docs/mintlify/**'
      - 'docs/site/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check_docs_no_internal_leakage.py'
      - 'scripts/check_mintlify_nav.py'
  push:
    branches: [main]
    paths:
      - 'docs/mintlify/**'
      - 'docs/site/**'
      - 'README.md'
      - 'CONTRIBUTING.md'

concurrency:
  group: docs-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint shipped docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run docs lint
        run: python3 scripts/check_docs_no_internal_leakage.py
        shell: bash
        continue-on-error: false

      # scripts/check_mintlify_nav.py existed, passed, and was invoked by
      # nothing: not this workflow, not the Makefile, not a test. A check
      # nobody runs is indistinguishable from a check that cannot fail —
      # an .mdx page added without a docs.json nav entry ships unreachable
      # and no gate says so. It is a docs check, so it belongs here, behind
      # the same paths filter.
      - name: Check every shipped .mdx is reachable from docs.json nav
        run: python3 scripts/check_mintlify_nav.py
        shell: bash
