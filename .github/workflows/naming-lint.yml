name: Naming lint

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

concurrency:
  group: naming-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint repository naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run naming linter
        run: python3 scripts/check_no_third_party_names.py

      - name: Run HUP naming linter
        run: python3 scripts/check_hup_naming.py
        shell: bash
        continue-on-error: false
