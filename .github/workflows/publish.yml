name: Release

# Staged release pipeline.
#
#   build  → install_smoke ┐
#                          ├→ publish
#          → stage         ┘
#
# Flow summary:
#   1. build         : build wheel+sdist, run a pre-publish in-tree smoke test,
#                      upload the dist/ as a workflow artifact. Nothing leaves
#                      GitHub Actions in this job.
#   2. install_smoke : install that wheel with `[all]` on 3.11 / 3.12 / 3.14
#                      and assert the `feral` console script runs. Calls
#                      install-smoke.yml. Unconstrained on purpose, so it can
#                      catch a marker-dependent resolution the 3.11 lockfile
#                      cannot (this is how 2026.8.3 shipped broken).
#   3. stage         : download the artifact, publish to TestPyPI (or the
#                      configured staging index), install from that staging
#                      index in a clean venv, and run the runtime smoke again
#                      against the *uploaded* wheel. Gated by environment
#                      `testpypi-stage` so maintainers can require manual
#                      approval before a canary upload.
#   4. publish       : requires 2 and 3 to have passed, and is gated by
#                      environment `pypi` so maintainers keep the
#                      manual-approval safety net on the production push.
#                      Publishes to PyPI and creates the GitHub Release.
#
# Triggers:
#   - tag push `v*` runs the full pipeline end-to-end.
#   - workflow_dispatch supports dry-run validation against the staged
#     path; production publish remains gated by successful canary.
#
# Secrets / auth model:
#   - Both `pypi` and the staging index use OIDC trusted publishing via
#     `pypa/gh-action-pypi-publish`. Configure each on the PyPI side as
#     a Trusted Publisher pointing at this repo + workflow filename +
#     the matching environment name. No long-lived API token is stored
#     in repo secrets.
#   - `id-token: write` is required for OIDC; `contents: write` is
#     required by `softprops/action-gh-release`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run build + stage only; do not publish to PyPI.'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build wheel + sdist (+ pre-publish smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: feral-client-v2/package-lock.json

      - name: Build + sync v2 web UI bundle
        env:
          FERAL_FORCE_NPM_CI: "1"
        run: scripts/build_webui_v2.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Verify bundled v2 model-picker contract
        run: python scripts/check_webui_v2_contract.py

      - name: Build wheel and sdist
        run: python -m build
        working-directory: feral-core

      - name: Read version from built artifact
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls feral-core/dist/*.whl | head -n 1)
          # wheel filename: feral_ai-<version>-py3-none-any.whl
          fname=$(basename "${wheel}")
          version=$(echo "${fname}" | awk -F'-' '{print $2}')
          if [ -z "${version}" ]; then
            echo "could not parse version from ${fname}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "  · built feral-ai==${version}"

      - name: Pre-publish wheel smoke (in-tree)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-smoke
          source .wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          # ``--constraint feral-core/requirements.lock`` pins every
          # transitive dep to the resolution we tested in CI, so the
          # pre-publish smoke is guaranteed to match the runtime graph
          # the broader test suite ran against. Without this, a
          # freshly-published next-major can sneak in between CI green
          # and the build job's smoke (see the fastapi==0.137
          # regression we admin-merged for four releases).
          python -m pip install \
            --constraint feral-core/requirements.lock \
            feral-core/dist/*.whl
          python scripts/release_wheel_smoke.py \
            --expected-version "${{ steps.meta.outputs.version }}"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: feral-ai-dist
          path: feral-core/dist/
          if-no-files-found: error
          retention-days: 7

  install_smoke:
    # The pre-publish gate. Installs the wheel this run just built, with
    # `[all]`, on 3.11 / 3.12 / 3.14, and asserts the console script runs.
    #
    # This used to live in install-smoke.yml behind `workflow_run: [Release]`,
    # which fires AFTER publish, so it could only report a bad release. It also
    # tolerated every failure with `|| true` and installed no extras. See F-09.
    #
    # It runs in parallel with `stage` rather than after it, because `stage` is
    # gated on a manual environment approval and there is no reason to make a
    # maintainer approve a canary for a wheel that cannot be installed.
    name: Install smoke (pre-publish gate)
    needs: build
    uses: ./.github/workflows/install-smoke.yml
    with:
      dist_artifact: feral-ai-dist
      expected_version: ${{ needs.build.outputs.version }}

  stage:
    name: Canary publish to TestPyPI + install smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: testpypi-stage
      url: https://test.pypi.org/project/feral-ai/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: feral-ai-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          # Re-runs of the same tag (e.g. after a flake) should not fail
          # on the "file already exists" error — TestPyPI is a canary,
          # not a source of truth.
          skip-existing: true

      - name: Wait for TestPyPI index to surface the new release
        # TestPyPI's index takes a few seconds to converge after upload.
        # Poll the JSON API instead of sleeping a fixed amount.
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "https://test.pypi.org/pypi/feral-ai/${EXPECTED_VERSION}/json" \
                 -o /dev/null; then
              echo "  · TestPyPI has feral-ai==${EXPECTED_VERSION} (attempt ${attempt})"
              exit 0
            fi
            echo "  · TestPyPI not ready yet (attempt ${attempt}); sleeping"
            sleep 10
          done
          echo "TestPyPI never surfaced feral-ai==${EXPECTED_VERSION}" >&2
          exit 1

      - name: Install from TestPyPI in a clean venv
        # Pull ONLY the target wheel from TestPyPI, then install that
        # local wheel while resolving dependencies from real PyPI.
        # This avoids dependency shadowing when TestPyPI has stale or
        # malformed third-party packages with the same names.
        #
        # TestPyPI's simple index lags behind the JSON API, sometimes by
        # a lot: the JSON probe above can succeed while
        # ``pip download --index-url https://test.pypi.org/simple/``
        # still 404s on the brand-new version.
        #
        # This budget used to be 12 attempts x 10s (2 minutes) and it
        # cost us a release. v2026.8.2 uploaded to TestPyPI cleanly at
        # 21:44:57, the canary gave up at 21:48:10, the publish job was
        # skipped, and 2026.8.2 never reached PyPI even though the tag
        # and the GitHub release existed. The artifact was fine; only
        # the gate was impatient. The version did show up on TestPyPI
        # later, which is the whole point.
        #
        # Now ~11 minutes with a backoff, because waiting longer costs
        # nothing on a release and a false failure costs a re-cut.
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv .stage-venv
          source .stage-venv/bin/activate
          python -m pip install --upgrade pip
          rm -rf .stage-dist
          mkdir -p .stage-dist
          shopt -s nullglob
          ATTEMPTS=30
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            if python -m pip download \
                 --no-deps \
                 --index-url https://test.pypi.org/simple/ \
                 --dest .stage-dist \
                 "feral-ai==${EXPECTED_VERSION}" 2>&1; then
              wheels=(.stage-dist/feral_ai-"${EXPECTED_VERSION}"-*.whl)
              if [ "${#wheels[@]}" -gt 0 ]; then
                echo "  · TestPyPI simple index served the wheel (attempt ${attempt})"
                break
              fi
            fi
            # Backoff: quick early (usually lands in the first minute),
            # patient later rather than hammering a lagging index.
            if   [ "${attempt}" -le 6  ]; then delay=10
            elif [ "${attempt}" -le 18 ]; then delay=20
            else                              delay=30
            fi
            echo "  · TestPyPI simple-index still propagating (attempt ${attempt}/${ATTEMPTS}); sleeping ${delay}s"
            sleep "${delay}"
            rm -rf .stage-dist
            mkdir -p .stage-dist
          done
          wheels=(.stage-dist/feral_ai-"${EXPECTED_VERSION}"-*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            {
              echo "No wheel for feral-ai==${EXPECTED_VERSION} appeared on the TestPyPI"
              echo "simple index after ${ATTEMPTS} attempts (~11 minutes)."
              echo
              echo "The upload step above runs BEFORE this one. If it reported"
              echo "'Uploading feral_ai-${EXPECTED_VERSION}-py3-none-any.whl' then the"
              echo "artifact is fine and this is index lag, not a bad build."
              echo "Check https://test.pypi.org/project/feral-ai/${EXPECTED_VERSION}/ and"
              echo "just re-run THIS job. Do not re-cut the release."
            } >&2
            ls -la .stage-dist >&2
            exit 1
          fi
          # The constraint file lives in the checked-out tree (not in
          # the downloaded wheel); use it to pin transitive deps the
          # same way the in-tree pre-publish smoke does.
          python -m pip install \
            --constraint feral-core/requirements.lock \
            --index-url https://pypi.org/simple/ \
            "${wheels[0]}"

      - name: Canary runtime smoke (against TestPyPI install)
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          source .stage-venv/bin/activate
          python scripts/release_wheel_smoke.py \
            --expected-version "${EXPECTED_VERSION}"

  publish:
    name: Publish to PyPI + create GitHub Release
    needs: [build, install_smoke, stage]
    # Production publish requires a successful canary stage AND a wheel that
    # installs with [all] on every supported Python.
    if: >-
      needs.build.result == 'success' &&
      needs.install_smoke.result == 'success' &&
      needs.stage.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/feral-ai/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: feral-ai-dist
          path: feral-core/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: feral-core/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: feral-core/dist/*
