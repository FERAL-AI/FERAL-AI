name: Native macOS checks

on:
  pull_request:
    paths:
      - 'desktop-native/**'
      - 'feral-core/config/profile_archive.py'
      - 'feral-core/config/native_preference_snapshot.py'
      - 'scripts/check_native_bundle.py'
      - 'scripts/tests/test_check_native_bundle.py'
      - 'scripts/check_packaged_core.py'
      - 'scripts/tests/test_check_packaged_core.py'
      - '.github/workflows/native-checks.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-native/**'
      - 'feral-core/config/profile_archive.py'
      - 'feral-core/config/native_preference_snapshot.py'
      - 'scripts/check_native_bundle.py'
      - 'scripts/tests/test_check_native_bundle.py'
      - 'scripts/check_packaged_core.py'
      - 'scripts/tests/test_check_packaged_core.py'
      - '.github/workflows/native-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Typecheck actual app entry and production sources
        working-directory: desktop-native
        run: bash build.sh --typecheck
      - name: Create isolated stdlib interpreter for offline archive fixtures
        run: |
          python -m venv --without-pip .venv
          PYTHONPATH=feral-core .venv/bin/python -S -m config.profile_archive --help
      - name: Native feature, linked-model and desktop checks
        working-directory: desktop-native
        run: bash test_features.sh
      - name: Real child-process lifeline checks
        working-directory: desktop-native
        run: python -m unittest -v test_native_lifeline.py
      - name: Exact runtime archive ownership and replacement checks
        working-directory: desktop-native
        run: ../.venv/bin/python acceptance/archive_runtime_owner_fixture.py --evidence-output "${{ github.workspace }}/native-archive-owner-evidence"
      - name: Preserve bounded synthetic archive-owner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-archive-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-archive-owner-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle-audit regression checks
        run: python -m unittest discover -s scripts/tests -p test_check_native_bundle.py -v
      - name: Frozen-runtime source comparison checks
        run: python -m unittest discover -s scripts/tests -p test_check_packaged_core.py -v

# These checks do not install or publish an app, access user accounts, or establish
# physical-device, GUI, payment, signing or notarization acceptance.
