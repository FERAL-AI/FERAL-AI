<!DOCTYPE html>
<html class="v2-dark">
<head>
  <!-- Canonical FERAL design tokens, generated from
       feral-client-v2/src/styles/tokens.css by desktop/scripts/sync_tokens.sh.
       Do not edit src/tokens.css. -->
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    :root.v2-dark { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The Tauri window is transparent:true, so this panel is meant to read as
       glass. --v2-surface-elev is the elevated-surface alpha and its value is
       chosen to be blurred, so it carries the matching blur token. */
    body {
      background: var(--v2-surface-elev);
      backdrop-filter: var(--v2-blur-md);
      -webkit-backdrop-filter: var(--v2-blur-md);
      font-family: var(--v2-font-system);
      color: var(--v2-text-primary);
    }
    .container { padding: 12px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    #command-input {
      flex: 1; background: var(--v2-surface-1);
      border: 1px solid var(--v2-hairline); color: var(--v2-text-primary);
      padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none;
    }
    #command-input:focus { border-color: var(--v2-accent); }
    #command-input::placeholder { color: var(--v2-text-tertiary); }
    .response { padding: 12px; margin-top: 8px; background: var(--v2-surface-1); border-radius: 8px; font-size: 13px; color: var(--v2-text-secondary); max-height: 400px; overflow-y: auto; display: none; white-space: pre-wrap; word-break: break-word; }
    /* Waiting and failed used to be the same empty panel. They are now two
       distinct, labelled states, and #response carries aria-live so a screen
       reader is told about either one. */
    .response.pending { color: var(--v2-text-tertiary); }
    .response.pending::before {
      content: "";
      display: inline-block;
      width: 7px; height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--v2-state-warn);
      animation: pending-pulse 1.2s ease-in-out infinite;
    }
    @keyframes pending-pulse {
      0%, 100% { opacity: .35; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .response.pending::before { animation: none; opacity: 1; }
    }
    .response.failed { color: var(--v2-state-error); }
    .status { font-size: 11px; color: var(--v2-text-tertiary); padding: 4px 12px; display: flex; justify-content: space-between; }
    .connected { color: var(--v2-state-live); }
    .disconnected { color: var(--v2-state-error); }
  </style>
</head>
<body>
  <div class="container">
    <div class="input-row">
      <input id="command-input" type="text" placeholder="Ask FERAL anything..." autofocus />
    </div>
    <div id="response" class="response" aria-live="polite"></div>
    <div class="status">
      <span id="status-text" class="disconnected">Connecting...</span>
      <span>Cmd+Shift+F to toggle</span>
    </div>
  </div>
  <script type="module">
    // Tauri v2 module import, not window.__TAURI__. This app is on
    // @tauri-apps/api v2 and does not set withGlobalTauri, so the global
    // was undefined and the Escape handler below silently did nothing.
    // Importing the API directly also avoids exposing the whole Tauri
    // surface to the page just to hide a window.
    import { getCurrentWindow } from '@tauri-apps/api/window';
    // Same bridge the main window uses. This panel used to open a
    // hardcoded ws://localhost:9090/v1/session, which is only ever right
    // by coincidence: FERAL_PUBLIC_BASE_URL / FERAL_BRAIN_URL are read in
    // the Rust process and can point anywhere, so with either set this
    // window read "Disconnected" forever while the main window worked.
    import { invoke } from '@tauri-apps/api/core';

    let ws = null;
    // Resolved once from get_brain_url and reused across reconnects.
    let sessionUrl = null;
    // True between a successful send and the first byte of the reply, so the
    // pending placeholder can be replaced rather than appended to.
    let awaitingReply = false;
    const input = document.getElementById('command-input');
    const response = document.getElementById('response');
    const status = document.getElementById('status-text');

    // One place that decides what the response panel says and how it looks.
    // `kind` is 'pending', 'failed' or 'reply'.
    function setResponse(text, kind) {
      response.className = kind === 'reply' ? 'response' : `response ${kind}`;
      response.textContent = text;
      response.style.display = 'block';
      awaitingReply = kind === 'pending';
    }

    // Derive the session WebSocket URL from the brain's HTTP base URL:
    // http -> ws, https -> wss, and any path prefix the base carries is
    // preserved so a brain behind a reverse proxy at /feral still works.
    function sessionUrlFrom(base) {
      const u = new URL(base);
      u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
      u.pathname = `${u.pathname.replace(/\/+$/, '')}/v1/session`;
      u.search = '';
      u.hash = '';
      return u.toString();
    }

    // get_brain_url is infallible on the Rust side, so an empty or
    // unparseable answer is reported rather than papered over with a
    // localhost guess, which is the bug this replaces.
    async function resolveSessionUrl() {
      let base;
      try {
        base = String(await invoke('get_brain_url') || '').trim();
      } catch (err) {
        setResponse(`Could not ask the app which brain to use: ${err}`, 'failed');
        return null;
      }
      if (!base) {
        setResponse('The app could not resolve a brain URL, so there is nothing to connect to. Set FERAL_BRAIN_URL before launching.', 'failed');
        return null;
      }
      try {
        return sessionUrlFrom(base);
      } catch (err) {
        setResponse(`The resolved brain URL is not usable: ${base} (${err})`, 'failed');
        return null;
      }
    }

    async function connect() {
      if (!sessionUrl) {
        sessionUrl = await resolveSessionUrl();
        if (!sessionUrl) {
          status.textContent = 'No brain URL';
          status.className = 'disconnected';
          setTimeout(() => { void connect(); }, 3000);
          return;
        }
      }
      ws = new WebSocket(sessionUrl);
      ws.onopen = () => { status.textContent = 'Connected'; status.className = 'connected'; };
      ws.onerror = () => { status.textContent = 'Disconnected'; status.className = 'disconnected'; };
      ws.onclose = () => {
        status.textContent = 'Disconnected';
        status.className = 'disconnected';
        // A request that was in flight when the socket closed has no reply
        // coming. Saying so beats leaving the pending dot pulsing forever.
        if (awaitingReply) {
          setResponse('The connection closed before the brain replied. Ask again once the status reads Connected.', 'failed');
        }
        setTimeout(() => { void connect(); }, 3000);
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'text_response' || msg.type === 'stream_delta') {
            const text = msg.payload?.text || '';
            if (text) {
              if (awaitingReply) {
                // Clear the pending placeholder before the first chunk, so a
                // stream is not appended to the word "Waiting".
                setResponse('', 'reply');
              }
              response.style.display = 'block';
              if (msg.type === 'stream_delta' && msg.payload?.final) {
                // Stream complete
              } else if (msg.type === 'text_response') {
                response.textContent = text;
              } else {
                response.textContent += text;
              }
            }
          }
        } catch { /* ignore parse errors */ }
      };
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const text = input.value.trim();
        if (!text) return;
        // The input used to be cleared unconditionally, before anything was
        // known about the socket: `ws?.send(...)` is skipped entirely while ws
        // is null and throws while it is CONNECTING or CLOSED, and either way
        // the user's text was already gone and an empty panel was already
        // showing. Nothing leaves the input until a send has succeeded.
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          setResponse('Not connected to the brain, so nothing was sent. Your text is still in the box; press Enter again once the status below reads Connected.', 'failed');
          return;
        }
        try {
          ws.send(JSON.stringify({
            hop: 'client',
            type: 'text_command',
            payload: { text, context: { source: 'desktop_tray' } }
          }));
        } catch (err) {
          setResponse(`Could not send: ${err}. Your text is still in the box.`, 'failed');
          return;
        }
        input.value = '';
        setResponse('Waiting for the brain …', 'pending');
      }
      if (e.key === 'Escape') {
        getCurrentWindow().hide();
      }
    });

    void connect();
  </script>
</body>
</html>
