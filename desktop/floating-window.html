<!DOCTYPE html>
<html class="v2-dark">
<head>
  <!-- Canonical FERAL design tokens, generated from
       feral-client-v2/src/styles/tokens.css by desktop/scripts/sync_tokens.sh.
       Do not edit src/tokens.css. -->
  <link rel="stylesheet" href="./src/tokens.css" />
  <style>
    :root.v2-dark { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The Tauri window is transparent:true, so this panel is meant to read as
       glass. --v2-surface-elev is the elevated-surface alpha and its value is
       chosen to be blurred, so it carries the matching blur token. */
    body {
      background: var(--v2-surface-elev);
      backdrop-filter: var(--v2-blur-md);
      -webkit-backdrop-filter: var(--v2-blur-md);
      font-family: var(--v2-font-system);
      color: var(--v2-text-primary);
    }
    .container { padding: 12px; }
    .input-row { display: flex; gap: 8px; align-items: center; }
    #command-input {
      flex: 1; background: var(--v2-surface-1);
      border: 1px solid var(--v2-hairline); color: var(--v2-text-primary);
      padding: 12px 16px; border-radius: 12px; font-size: 15px; outline: none;
    }
    #command-input:focus { border-color: var(--v2-accent); }
    #command-input::placeholder { color: var(--v2-text-tertiary); }
    .response { padding: 12px; margin-top: 8px; background: var(--v2-surface-1); border-radius: 8px; font-size: 13px; color: var(--v2-text-secondary); max-height: 400px; overflow-y: auto; display: none; white-space: pre-wrap; word-break: break-word; }
    .status { font-size: 11px; color: var(--v2-text-tertiary); padding: 4px 12px; display: flex; justify-content: space-between; }
    .connected { color: var(--v2-state-live); }
    .disconnected { color: var(--v2-state-error); }
  </style>
</head>
<body>
  <div class="container">
    <div class="input-row">
      <input id="command-input" type="text" placeholder="Ask FERAL anything..." autofocus />
    </div>
    <div id="response" class="response"></div>
    <div class="status">
      <span id="status-text" class="disconnected">Connecting...</span>
      <span>Cmd+Shift+F to toggle</span>
    </div>
  </div>
  <script type="module">
    // Tauri v2 module import, not window.__TAURI__. This app is on
    // @tauri-apps/api v2 and does not set withGlobalTauri, so the global
    // was undefined and the Escape handler below silently did nothing.
    // Importing the API directly also avoids exposing the whole Tauri
    // surface to the page just to hide a window.
    import { getCurrentWindow } from '@tauri-apps/api/window';

    let ws = null;
    const input = document.getElementById('command-input');
    const response = document.getElementById('response');
    const status = document.getElementById('status-text');

    function connect() {
      ws = new WebSocket('ws://localhost:9090/v1/session');
      ws.onopen = () => { status.textContent = 'Connected'; status.className = 'connected'; };
      ws.onclose = () => { status.textContent = 'Disconnected'; status.className = 'disconnected'; setTimeout(connect, 3000); };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'text_response' || msg.type === 'stream_delta') {
            const text = msg.payload?.text || '';
            if (text) {
              response.style.display = 'block';
              if (msg.type === 'stream_delta' && msg.payload?.final) {
                // Stream complete
              } else if (msg.type === 'text_response') {
                response.textContent = text;
              } else {
                response.textContent += text;
              }
            }
          }
        } catch { /* ignore parse errors */ }
      };
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        response.textContent = '';
        response.style.display = 'block';
        ws?.send(JSON.stringify({
          hop: 'client',
          type: 'text_command',
          payload: { text: input.value, context: { source: 'desktop_tray' } }
        }));
        input.value = '';
      }
      if (e.key === 'Escape') {
        getCurrentWindow().hide();
      }
    });

    connect();
  </script>
</body>
</html>
