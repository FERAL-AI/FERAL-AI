<!DOCTYPE html>
<html lang="en" class="v2-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERAL</title>
  <!-- Canonical FERAL design tokens. Generated from
       feral-client-v2/src/styles/tokens.css by desktop/scripts/sync_tokens.sh,
       which npm run build runs before vite. Do not edit src/tokens.css. -->
  <link rel="stylesheet" href="/src/tokens.css" />
  <style>
    /* This app's roles, mapped onto the tokens above. Every colour in the
       desktop shell resolves through one of these, or through a --v2-* token
       directly. No hex literals below this block. */
    /* The shell is dark-only: this chrome is only the loading, setup and error
       screens, and the brain UI it hands off to carries its own theme.
       .v2-dark on <html> pins tokens.css to its dark ramp. The selector is
       :root.v2-dark rather than :root so it outranks the color-scheme in
       tokens.css, which Vite emits after this block. */
    :root.v2-dark { color-scheme: dark; }

    :root {
      --bg:       var(--v2-bg-deep);
      --surface:  var(--v2-bg-base);
      --border:   var(--v2-hairline);
      --text:     var(--v2-text-primary);
      --muted:    var(--v2-text-secondary);
      --accent:   var(--v2-accent);
      /* Second stop of the wordmark gradient, which runs --text -> --accent2.
         The v2 system is deliberately one accent plus neutrals, so the
         gradient runs neutral-to-accent rather than reaching for a second
         hue the way the old violet pair did. */
      --accent2:  var(--v2-accent);
      --glow:     var(--v2-accent-ring);
      --danger:   var(--v2-state-error);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--v2-font-system); overflow: hidden; }
    #app { height: 100%; }

    /* ----- Splash / loading screen ----- */
    .splash {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      /* The ambient light the two indigo/violet radial washes were imitating
         is already a token, and it is grayscale. It goes on the element's own
         background, not on ::before, because ::before is positioned and would
         paint over the splash text, which is not. */
      background: var(--v2-shell-ambient);
    }
    .splash::before {
      content: "";
      position: absolute;
      inset: 0;
      /* Translucent neutral highlight. Must stay translucent: this layer sits
         above the splash text in paint order. */
      background: var(--v2-glass-tint);
      pointer-events: none;
    }

    .splash-logo {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 1.5rem;
    }
    .splash-logo svg { width: 100%; height: 100%; }
    .splash-logo .glow-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .splash-logo .glow-ring:nth-child(2) { animation-delay: 0.8s; }
    .splash-logo .glow-ring:nth-child(3) { animation-delay: 1.6s; }
    @keyframes pulse-ring {
      0%   { transform: scale(.85); opacity: .6; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .splash-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .splash-subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .splash-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 0.75rem;
    }
    .splash-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .3;
      animation: dot-blink 1.4s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: .2s; }
    .splash-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-blink {
      0%, 80%, 100% { opacity: .3; transform: scale(1); }
      40% { opacity: 1; transform: scale(1.3); }
    }

    .splash-status {
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* ----- Error screen ----- */
    .error-wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .error-icon {
      width: 52px; height: 52px;
      margin-bottom: 1rem;
      color: var(--danger);
    }
    .error-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    /* .hint is the same block used by the first-run screen, which is not an
       error. .error-hint is kept as the alias so the error screen's markup
       does not have to change. */
    .hint, .error-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      max-width: 400px;
      line-height: 1.5;
    }
    .hint code, .error-hint code, .splash-subtitle code {
      background: var(--surface);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.85em;
    }
    /* What the app actually resolved: the feral-core directory, the
       interpreter (or why every candidate was rejected) and the brain URL,
       from the brain_runtime_info command. Monospace and left aligned
       because these are paths the operator has to read character by
       character, and scrollable because they are long. */
    .detail-block {
      font-family: var(--v2-font-mono);
      font-size: 0.74rem;
      line-height: 1.55;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.1rem;
      width: 100%;
      max-width: 460px;
      max-height: 190px;
      overflow: auto;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .btn {
      padding: 0.55rem 1.5rem;
      background: var(--accent);
      color: var(--v2-text-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: filter .15s, transform .1s;
    }
    /* Was a hand-picked darker indigo. The v2 set has one accent and no
       hover shade for it, so the hover state is derived from the accent
       instead of introducing a second blue that nothing else defines. */
    .btn:hover { filter: brightness(1.14); }
    .btn:active { transform: scale(.97); }

    /* ----- Iframe (brain loaded) ----- */
    .frame { width: 100%; height: 100vh; border: none; display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
