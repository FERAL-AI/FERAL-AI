# AUDIT-FIXES S-1. Config lives in a file rather than CI flags so a
# developer running `mypy .` locally gets the same answer as the gate.
[mypy]
# Without this, mypy reads Field("", ...) as a REQUIRED field and reports a
# call-arg error at every construction that omits it. The codebase uses that
# positional-default form in 62 places, so the alternative was 62 mechanical
# edits to Field(default=...). One config line does the same job, and it
# also drops 36 other errors the plugin resolves correctly.
plugins = pydantic.mypy
ignore_missing_imports = True
# feral-core/build/lib is a complete duplicate of the source tree. Without
# this mypy does not report a worse number, it refuses to start at all:
#   build/lib/agents/__init__.py: error: Duplicate module named "agents"
#   Found 1 error in 1 file (errors prevented further checking)
# See trap 1 in CLAUDE.md.
exclude = (^build/|^dist/)
