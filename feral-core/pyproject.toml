[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feral-ai"
version = "2026.8.3"
description = "FERAL — Open-source AI agent with computer use, GenUI, voice, hardware control, and persistent memory."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mahmoud Omar"},
    {name = "Alpay Kasal", email = "info@feral.io"},
]
requires-python = ">=3.11"
keywords = ["agent", "ai", "genui", "voice", "hardware", "mcp", "computer-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Upper bound: FastAPI 0.137.0 regressed `app.include_router(...)` so
    # that most sub-router routes silently fail to register at import time
    # (the app boots with ~17 routes instead of the full set, tripping the
    # boot-time auth-allowlist drift guard). Pin below 0.137 until that
    # upstream regression is resolved. See release wheel-smoke failure for
    # v2026.6.13.
    "fastapi>=0.115.0,<0.137",
    # PR 10: chat composer attachments + wiki PDF ingestion both use
    # multipart/form-data, which FastAPI delegates to python-multipart.
    # Without this, /api/uploads and /api/wiki/ingest/pdf raise a
    # ``RuntimeError: Form data requires "python-multipart"`` at first
    # use — surfacing the dependency at install time avoids that.
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "websockets>=13.0,<16.0",
    "httpx>=0.27.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0.0,<15.0",
    # CLI UX overhaul: arrow-key selects + masked-character paste in
    # `feral setup`, `feral install`, `feral key`, and `feral access`.
    # InquirerPy wraps prompt_toolkit to render selects, fuzzy
    # filters, and a per-character masked secret input. Falls back to
    # plain `input` / `getpass` when stdin/stdout is non-interactive.
    "InquirerPy>=0.3.4,<1.0",
    "duckduckgo-search>=6.0.0,<9.0",
    "html2text>=2024.2.26,<2026.0",
    "pymupdf>=1.24.0,<2.0",
    "numpy>=1.24.0,<3.0",
    "Pillow>=10.0.0,<12.0",
    "aiohttp>=3.9.0,<4.0",
    "openai>=1.50.0,<2.0",
    "PyJWT>=2.8.0,<3.0",
    "prometheus-client>=0.20,<1.0",
    # Brain-local CuteBot USB serial (micro:bit @ 115200).
    "pyserial>=3.5,<4.0",
    # v2026.5.33 Option C: MemoryStore is async-native. aiosqlite is the
    # async wrapper around the stdlib sqlite3 driver — it runs SQLite
    # calls on a single dedicated thread per connection so the asyncio
    # event loop never blocks on a query. Every FERAL memory path
    # (FastAPI handlers, orchestrator, sync scheduler, decay sweeper)
    # awaits MemoryStore directly without thread-pool bridging.
    "aiosqlite>=0.20.0,<1.0",
    # v2026.8.3: real local embeddings are part of the install, not an
    # opt-in extra. Same reasoning that promoted `qrcode[pil]` below:
    # persistent memory is the feature people install FERAL for, and
    # without fastembed the EmbeddingProvider silently selects the
    # SHA-256 `hash` fallback. That fallback is not "slightly worse
    # search", it is not search: with it, `feral memory search
    # "building"` finds a note and `feral memory search "what am I
    # building?"` returns nothing, because a hash projection has no
    # notion of similarity. Nothing in the product surfaces that
    # difference at the moment a user hits it.
    #
    # The cost is measured, not estimated, and the basis is stated
    # because "how big is it" has two honest answers. fastembed runs
    # BAAI/bge-small-en-v1.5 on onnxruntime and pulls NO torch. Its
    # transitive closure with sqlite-vec is 30 distributions, ~226MB
    # installed on disk (macOS arm64, CPython 3.11); ~177MB of that is
    # net new once you subtract what core already carries (numpy,
    # Pillow, PyYAML, tqdm, certifi, idna, typing-extensions). Two
    # packages are ~80% of it: onnxruntime (66MB) and the sympy (75MB)
    # it depends on. Compare ~2.5GB for a torch-backed
    # sentence-transformers stack, which is the whole reason fastembed
    # is the choice here.
    #
    # First embed downloads the ~130MB model once. `feral setup` warms
    # it (see cli/setup/steps/memory.py) so that cost is paid during
    # setup, not on the user's first question. The model is 384-dim,
    # exactly LOCAL_DIM, so no index migration.
    #
    # Licence: Apache-2.0. The bundled LICENSE and the upstream repo
    # are both Apache-2.0; the "Other/Proprietary" trove classifier in
    # its published metadata is wrong. The model is MIT. No copyleft
    # obligation of the kind that keeps piper-tts out of the default
    # install (see the `tts-piper` extra).
    "fastembed>=0.8,<0.9",
    # Ships with fastembed for the same reason: the vec0 virtual table
    # is what keeps memory search sub-linear as the store grows.
    # Apache-2.0 / MIT dual-licensed.
    #
    # Installing it is necessary but not always sufficient, and the
    # setup wizard says so out loud rather than claiming success.
    # Loading a SQLite extension requires an interpreter built with
    # `--enable-loadable-sqlite-extensions`; pyenv omits that on macOS
    # by default, so `sqlite3.Connection` has no `enable_load_extension`
    # and the extension can never load no matter how the package was
    # installed. FERAL is correct either way (VectorIndex falls back to
    # a numpy brute-force scan) but the fallback is O(n) per query.
    "sqlite-vec>=0.1.1,<1.0",
    "cryptography>=41.0.0,<50.0",
    "pynacl>=1.5.0,<2.0",
    # W9: vault encryption-at-rest. The OS keychain is now a hard
    # requirement of the security path — `keyring` reads/writes the
    # 32-byte ChaCha20-Poly1305 master key from
    # macOS Keychain / Linux Secret Service / Windows Credential Manager.
    "keyring>=25.0,<26.0",
    # W9: pairing-token hashing. argon2id is the primary KDF; bcrypt is
    # the documented fallback when argon2-cffi is genuinely unavailable
    # on a given platform (see security/device_pairing.py).
    "argon2-cffi>=23.1,<24.0",
    # v2026.5.36 — QR pairing is a first-run feature, NOT an opt-in
    # extra. Pre-v2026.5.36 the `qrcode[pil]` package only landed via
    # the `[discovery]` or `[all]` extras, which meant a bare
    # `pip install feral-ai` produced an installation where the very
    # first thing a user is asked to do (pair a device by QR) crashed
    # with a 500 because `/api/devices/pair/qr` couldn't import
    # `qrcode`. Promoting the dep into the base block is the only
    # honest fix: anyone who installs FERAL can immediately pair.
    "qrcode[pil]>=7.4,<9.0",
    # v2026.5.36 — Honest macOS TCC probes (Accessibility / Screen
    # Recording) require Apple's ApplicationServices + Quartz APIs,
    # which are exposed to Python only via PyObjC. Pre-v2026.5.36 the
    # `feral doctor` command on a clean macOS install printed two
    # yellow warnings ("PyObjC ApplicationServices not importable",
    # "PyObjC Quartz not importable") that no amount of FERAL setup
    # could clear — the deps simply weren't in the wheel. The PEP-508
    # environment marker keeps Linux/Windows wheels untouched.
    "pyobjc-framework-ApplicationServices>=10.0,<13.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0,<13.0; sys_platform == 'darwin'",
]

# ─────────────────────────────────────────────────────────────
# Dependency-ceiling policy (CI-flake fix, P1)
# ─────────────────────────────────────────────────────────────
#
# Every runtime dep above carries an upper bound of the form
# ``<next-major`` (or ``<next-minor`` for pre-1.0 libraries where the
# minor IS the breaking-change line). The bounds exist because the
# release wheel-smoke (``scripts/release_wheel_smoke.py``) is a bare
# ``pip install`` with no constraints — a clean resolve a week from
# now is allowed to pull a freshly-published next-major that breaks
# the import surface. We have ALREADY been bitten by that pattern
# (``fastapi==0.137`` regressed ``include_router``, see comment above
# its bound), and the cost of an emergency hotfix is two admin-merges
# and a CHANGELOG entry per occurrence. Conservative upper bounds keep
# security patches reachable (every patch-/minor-bump still installs)
# while making major-bump breakage a deliberate, audited operation —
# someone has to raise the ceiling on purpose.
#
# Reproducibility: the committed ``requirements.lock`` (alongside this
# file, generated by ``scripts/regen_lockfile.sh``) pins every
# transitive dep too. The CI install (.github/workflows/ci.yml) and
# the release wheel-smoke (publish.yml) feed it via
# ``--constraint requirements.lock`` so the wheel is built and tested
# against an exact resolution. Re-pin by re-running the regen script
# whenever a runtime dep is updated.

[project.optional-dependencies]
llm = [
    "openai>=1.50.0,<2.0",
    "exa-py>=1.0.0,<3.0",
    "numpy>=1.24.0,<3.0",
    "Pillow>=10.0.0,<12.0",
    "aiohttp>=3.9.0,<4.0",
]
# NOTE: `sqlite-vec` moved to base `dependencies` in v2026.8.3 (see the
# comment there). Kept as an alias so `pip install feral-ai[vec]` keeps
# resolving for anyone following an older install guide; pip handles the
# duplicate.
vec = [
    "sqlite-vec>=0.1.1,<1.0",
]
# NOTE: `fastembed` moved to base `dependencies` in v2026.8.3. Real
# local embeddings are a first-run feature, not an opt-in. The full
# rationale (size, licence, why the hash fallback is not acceptable as a
# default) lives with the dep itself in the base block.
#
# This extra is kept alive because it is referenced from the README,
# the install guides, and the `feral doctor` hint, so `pip install
# 'feral-ai[embeddings]'` must keep resolving. It now also pulls
# sqlite-vec, which is what a reader of that hint expects "install the
# embeddings stack" to mean.
embeddings = [
    "fastembed>=0.8,<0.9",
    "sqlite-vec>=0.1.1,<1.0",
]
memory-chroma = [
    "chromadb>=0.5.0,<2.0",
]
memory-qdrant = [
    "qdrant-client>=1.11.0,<2.0",
]
groq = [
    "openai>=1.50.0,<2.0",
]
local = [
    "llama-cpp-python>=0.3.0,<1.0",
]
wasm = [
    "wasmtime>=22.0.0,<50.0",
]
sync = [
    "zeroconf>=0.131.0,<1.0",
]
discovery = [
    "zeroconf>=0.131.0,<1.0",
    # NOTE: `qrcode[pil]` moved to base `dependencies` in v2026.5.36 —
    # QR pairing is first-run, not opt-in. Kept this extra alive (it's
    # widely referenced in docs / install guides) so `pip install
    # feral-ai[discovery]` still resolves; pip handles the duplicate.
]
# Local STT, CTranslate2 backend. The right choice on Linux and on any
# machine with an NVIDIA GPU. NOT the right choice on macOS: CTranslate2
# has no Metal backend and `device="mps"` raises, so it runs on CPU
# while looking like the accelerated option. Macs want `stt-local`.
stt = [
    "faster-whisper>=1.0.0,<2.0",
]
# Local STT, whisper.cpp backend. MIT, prebuilt wheels for macOS arm64
# and manylinux, and the only Whisper family member with real Apple
# Silicon GPU acceleration (measured: whisper.cpp binds Metal / MTL0 on
# an M1 and decodes 2.16s of speech in 0.096s warm). Default local STT
# on macOS.
stt-local = [
    "pywhispercpp>=1.3.0,<2.0",
]
# Local TTS via Piper.
#
# READ THIS BEFORE ADDING IT TO A DEFAULT INSTALL. piper-tts is
# GPL-3.0-or-later (it relicensed from MIT with the piper1-gpl
# rewrite). FERAL is Apache-2.0. Combining Apache-2.0 code with a
# GPL-3.0 dependency it requires to function carries obligations the
# rest of this project does not, so Piper is never installed
# implicitly, is never a default, and is never the macOS default,
# where the OS `say` synthesiser does the same job with no licensing
# question and nothing to download.
#
# The upper bound is `<1.5` on macOS and only on macOS, and it is not a
# caution, it is a measured defect. piper-tts 1.5.0 and 1.6.0 ship
# macOS arm64 wheels whose espeakbridge.so has the CI build machine's
# espeak-ng-data path linked into it and ignores every override
# (espeak_data_dir=, ESPEAK_DATA_PATH, ESPEAK_DATA_DIR,
# PIPER_ESPEAK_DATA, and a direct espeakbridge.initialize call were all
# tested). Worse, it fails by calling exit(1) from native code rather
# than raising, so it takes the whole process with it. 1.4.2 was
# verified working end to end on an M1. Linux wheels are unaffected and
# keep the full range.
tts-piper = [
    "piper-tts>=1.2.0,<1.5; sys_platform == 'darwin'",
    "piper-tts>=1.2.0,<2.0; sys_platform != 'darwin'",
]
# Historical alias. `feral-ai[tts]` has always meant Piper and is
# referenced from install guides, so it keeps resolving. Same GPL-3.0
# terms and the same macOS pin as `tts-piper` above - the name simply
# predates the relicensing and does not advertise it.
tts = [
    "piper-tts>=1.2.0,<1.5; sys_platform == 'darwin'",
    "piper-tts>=1.2.0,<2.0; sys_platform != 'darwin'",
]
# Server-side voice activity detection (Silero VAD, MIT, ~2.2MB ONNX).
# This is what ends an utterance in the chained pipeline. Without it
# the pipeline falls back to a packet-absence timer that cannot fire
# until the client stops sending, which costs roughly 1.9s per turn
# (measured: 2218ms to endpoint before, 309ms after).
#
# onnxruntime is also pulled by `wake`; pip resolves the duplicate.
vad = [
    "onnxruntime>=1.16.0,<2.0",
]
# Everything needed for a fully-local voice stack on macOS: local
# endpointing plus local STT. Local TTS is the built-in `say`, so
# there is nothing to install for it. Note that the LLM is NOT covered
# by this extra and is still whatever remote provider is configured.
voice-local = [
    "onnxruntime>=1.16.0,<2.0",
    "pywhispercpp>=1.3.0,<2.0",
]
wake = [
    "openwakeword>=0.6.0,<1.0",
    "onnxruntime>=1.16.0,<2.0",
]
desktop = [
    "pyautogui>=0.9.54,<1.0",
]
browser = [
    "playwright>=1.40.0,<2.0",
]
mqtt = [
    "aiomqtt>=2.0.0,<3.0",
]
observability = [
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    # W13: Prometheus exposition for /metrics + named registry. The
    # OTel SDK pulls prometheus_client transitively in some installs but
    # not all wheels, so it's pinned here so `pip install feral-ai[observability]`
    # always provides the registry the dashboard + alerts target.
    "prometheus-client>=0.20,<1.0",
]
# Track A provider + channel extras (added in 2026.4.18).
# Together, OpenRouter, Fireworks all speak OpenAI-compatible JSON — the
# `openai` client is already a core dep, but the extras here are named so
# users discover them via `pip install feral-ai[together]` etc.
together = [
    "openai>=1.50.0,<2.0",
]
openrouter = [
    "openai>=1.50.0,<2.0",
]
fireworks = [
    "openai>=1.50.0,<2.0",
]
bedrock = [
    "boto3>=1.34.0,<2.0",
]
# Channel extras are opt-in because each ships heavyweight deps.
channel-matrix = [
    "matrix-nio>=0.24.0,<1.0",
]
channel-signal = [
    # Pick ONE backend — signald (JSON socket, cleaner) vs signal-cli-rest-api
    # (subprocess). The signal.py stub defers the choice until the
    # follow-up PR lands; no hard dep is added here yet.
]
channel-voice-call = [
    "twilio>=9.0.0,<11.0",
]
channel-feishu = [
    "lark-oapi>=1.4.0,<2.0",
]
channel-zalo = [
    # Zalo OA REST API is plain HTTPS over httpx (already a core dep).
]
all = [
    "openai>=1.50.0,<2.0",
    "exa-py>=1.0.0,<3.0",
    "numpy>=1.24.0,<3.0",
    "pyautogui>=0.9.54,<1.0",
    "Pillow>=10.0.0,<12.0",
    "aiohttp>=3.9.0,<4.0",
    "playwright>=1.40.0,<2.0",
    "wasmtime>=22.0.0,<50.0",
    "zeroconf>=0.131.0,<1.0",
    # v2026.5.36 — `qrcode[pil]` moved to base `dependencies` (first-run
    # feature). Left out of `[all]` to avoid pip resolver duplicate
    # work; the base wheel always carries it.
    "onnxruntime>=1.16.0,<2.0",
    # v2026.8.3: `fastembed` and `sqlite-vec` moved to base
    # `dependencies`. `[all]` no longer has to opt into real local
    # vectors, because every install has them. Left out of this list
    # (like `qrcode[pil]` above) to avoid pip resolver duplicate work;
    # the base wheel always carries both.
    "rich>=13.0.0,<15.0",
    "faster-whisper>=1.0.0,<2.0",
    # Local STT via whisper.cpp. MIT, and the only Whisper backend with
    # Apple Silicon GPU support, so `[all]` on a Mac gets a local STT
    # that actually uses the hardware.
    "pywhispercpp>=1.3.0,<2.0",
    # piper-tts is deliberately NOT here.
    #
    # It is GPL-3.0-or-later and FERAL is Apache-2.0. `pip install
    # feral-ai[all]` reads as "give me the optional features", not as
    # "add a copyleft dependency to my install", and someone
    # redistributing a product built on `[all]` would inherit an
    # obligation nothing told them about. Local TTS is available
    # explicitly via `feral-ai[tts-piper]`, and on macOS the built-in
    # `say` synthesiser covers it with no dependency at all.
    "aiomqtt>=2.0.0,<3.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "prometheus-client>=0.20,<1.0",
]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<7.0",
    # CI-flake fix: pin the test-timeout plugin into dev so a clean
    # ``pip install -e .[dev]`` reproduces the CI "fast lane" gating
    # (--timeout=60 surfaces single-test hangs as a named failure
    # instead of swallowing the whole job into a 30-min CI cancel).
    "pytest-timeout>=2.3.0,<3.0",
    # CI-flake fix: pytest-randomly is a dev tool that exposes order-
    # dependent test bleed by shuffling collection per run. Adding it
    # to dev (off by default in CI to keep diagnostics reproducible;
    # devs run with the plugin to surface order-deps locally) is the
    # difference between catching the next manifest-dispatch-style
    # leak before merge vs four releases of admin-merging the same
    # 60s timeout.
    "pytest-randomly>=3.15.0,<5.0",
    # W9: freezegun is used by tests/test_pairing_hash.py
    # (TestVerify.test_freezegun_simulates_ttl_passage and
    # TestVerify.test_successful_verify_slides_window) to drive the
    # sliding-TTL window deterministically without sleeping.
    "freezegun>=1.4.0,<2.0",
]

# Optional demo data + simulators. NEVER installed by default —
# `pip install feral-ai` ships with zero synthetic-biometric code.
# Install via `pip install feral-ai[demo]` (or directly:
# `pip install feral-demo-data`) to get scripted scenarios + the
# wristband / smart-home simulators for development.
demo = [
    "feral-demo-data>=0.1.0,<1.0",
]

[project.scripts]
feral = "cli.main:main"

[project.urls]
Homepage = "https://github.com/FERAL-AI/FERAL-AI"
Issues = "https://github.com/FERAL-AI/FERAL-AI/issues"

[tool.setuptools]
py-modules = ["version"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*", "api*", "channels*", "cli*", "config*", "cost*", "gateway*",
    "genui*", "hardware*", "identity*", "infra*", "integrations*",
    "mcp*", "memory*", "models*", "observability*", "perception*",
    "providers*", "security*", "services*", "skills*", "voice*",
    "webui*", "webui_v2*",
    # audit-r9 brief #08: `workflows` is a sibling top-level package
    # (data-only, holds first-party workflow-pack JSONs). Was omitted
    # from the include list, so it never made it into the wheel and
    # `default_workflow_packs_dir()` resolved to a non-existent path
    # at runtime. The brain logged "Workflow-pack directory not found
    # (skipping)" and the 10 curated packs were silently absent from
    # `/api/workflow-packs`.
    "workflows*",
]
# `tests*` was previously included here, which shipped the entire
# pytest suite inside the wheel. That bloated the install and risked
# top-level name collisions on `tests` (a common module name). Drop
# them from the published artifact in 2026.5.13.
exclude = ["tests*"]

[tool.setuptools.package-data]
"skills.manifests" = ["*.json"]
"config" = ["*.yaml", "*.yml"]
# The `providers` package ships its .py modules, but the model catalog
# data file (`providers/model_catalog.json`) was never globbed into the
# wheel — so pip-installed users hit "model catalog missing ... using
# fallback pricing" on every request and the provider/model lists fell
# back to a static set. Ship the JSON data with the package.
"providers" = ["*.json"]
# audit-r9 brief #08: ship the first-party persona + workflow-pack
# JSON manifests in the wheel. Without these entries, `pip install
# feral-ai` produced an installation where `default_personas_dir()`
# and `default_workflow_packs_dir()` pointed to non-existent paths
# (the loaders politely skipped, hiding the missing data behind an
# INFO log). The dev tree had the JSONs all along — they just never
# made it into the published wheel.
"agents.personas" = ["*.json", "*.md"]
"workflows" = ["*.json", "*.md"]
# v2026.5.29 — `*.webmanifest` and `*.txt` must be globbed in too.
# Pre-fix the wheel shipped `manifest.webmanifest` only when its name
# matched another glob (it didn't), so `pip install feral-ai` left the
# brain returning 404 on `/v2/manifest.webmanifest` while local dev
# checkouts had the file and looked fine.
"webui" = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico", "*.json", "*.webmanifest", "*.txt"]
"webui.assets" = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico", "*.json", "*.map"]
# v2 ambient-OS bundle — the wheel MUST carry these or pip-installed
# users fall back to the v1 UI. See feral-core/api/server.py::_webui_v2_dir.
"webui_v2" = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico", "*.json", "*.webmanifest", "*.txt"]
"webui_v2.assets" = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.ico", "*.json", "*.map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# CI-flake fix: pin the pytest-asyncio event-loop scope to ``function``
# explicitly. The default in pytest-asyncio 0.24 is already
# ``function`` for ``asyncio_mode=auto``, but the project was relying
# on the implicit default — a future minor-version bump (e.g. 0.25
# considered changing the default to ``session``) would silently
# share the loop across tests and reintroduce the cross-test bleed
# we just fixed in ``test_episode_save_fire_forget.py`` /
# ``test_a13_env_isolation.py``. Pin both scopes here so the
# behaviour is explicit and tracked in this file.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "no_auto_feral_home: skip the autouse FERAL_HOME isolation fixture",
    "chaos: federated-sync chaos / recovery tests (W11, roadmap §3.3 #1)",    "soak: long-duration soak test (gated behind --runsoak); see W12 / roadmap §3.4 #3-4",
    "live: round-trip against live external APIs (OpenAI etc); gated by FERAL_LIVE_TESTS=1 + API key env vars; never run in CI",
    "allow_network: test may open sockets to non-local hosts; the autouse block_outbound_network guard is skipped for it",
]
# Coverage is on by default for every `pytest` run. The previous setup
# configured [tool.coverage.*] but never forced `--cov`, so pytest-cov
# was installed and dormant. Overridable: `pytest --no-cov` to skip
# (e.g. when profiling or debugging).
addopts = "--cov=. --cov-report=term-missing:skip-covered --cov-fail-under=50"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/webui/*",
    "*/webui_v2/*",
    "setup.py",
    "demo/*",
    "docs/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Raised from 48 → 50 immediately (this commit). Ratchet lives in
# docs/coverage.md. Subsequent commits will keep pushing the floor up
# as tests backfill.
fail_under = 50
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]
